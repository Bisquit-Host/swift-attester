services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-attest_service}
      POSTGRES_USER: ${DATABASE_USERNAME:-vapor}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-vapor}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - attest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-vapor} -d ${DATABASE_NAME:-attest_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEAM_ID: ${TEAM_ID:-ABCDE12345}
      BUNDLE_ID: ${BUNDLE_ID:-host.bisquit.Bisquit-host}
      BEARER_KEY: ${BEARER_KEY:-replace-with-random-service-token}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-vapor}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-vapor}
      DATABASE_NAME: ${DATABASE_NAME:-attest_service}
      APP_ATTEST_ENVIRONMENT: ${APP_ATTEST_ENVIRONMENT:-production}
      CHALLENGE_TTL_SECONDS: ${CHALLENGE_TTL_SECONDS:-300}
    ports:
      - "1992:1992"

volumes:
  attest-postgres-data:
